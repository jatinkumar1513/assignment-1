<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>

    <style>
       
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #edf3f3;
            color: #263746;
            padding: 20px;
        }

        
        .dashboard {
            display: grid;

            
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));

            gap: 15px;
            grid-template-areas:
                "head head head head"
                "side main main main"
                "foot foot foot foot";

            max-width: 1200px;
            margin: auto;
        }

        
        .header {
            grid-area: head;
            background-color: #073653;
            color: white;
            padding: 20px;
            min-height: 140px;
            border-radius: 10px;
        }

        .sidebar {
            grid-area: side;
            background-color: #dcebed;
            padding: 15px;
            border-radius: 10px;
        }

        .main-content {
            grid-area: main;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            align-content: start;
        }

        .footer {
            grid-area: foot;
            background-color: #0879bd;
            color: white;
            text-align: center;
            padding: 25px;
            min-height: 130px;
            border-radius: 10px;
        }

        .sidebar h3 {
            margin-bottom: 10px;
        }

        .sidebar ul {
            padding-left: 20px;
        }

        .sidebar li {
            margin-bottom: 8px;
        }

        
        .stat-card {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;

            background-color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            min-height: 85px;
        }

        .icon {
            font-size: 30px;
            flex-shrink: 0;
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-info strong {
            font-size: 16px;
        }

        .stat-info span {
            font-size: 14px;
        }

       
      
    </style>
</head>

<body>

    <div class="dashboard">

       
        <header class="header">
            <h1>My Dashboard</h1>
        </header>

       
        <aside class="sidebar">
            <h3>Menu</h3>
            <ul>
                <li>Home</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </aside>

       
        <main class="main-content">

            <div class="stat-card">
                <div class="icon">👤</div>
                <div class="stat-info">
                    <strong>120</strong>
                    <span>Users</span>
                </div>
            </div>

            <div class="stat-card">
                <div class="icon">💰</div>
                <div class="stat-info">
                    <strong>Rs 45K</strong>
                    <span>Sales</span>
                </div>
            </div>

            <div class="stat-card">
                <div class="icon">📦</div>
                <div class="stat-info">
                    <strong>36</strong>
                    <span>Orders</span>
                </div>
            </div>

            <div class="stat-card">
                <div class="icon">⭐</div>
                <div class="stat-info">
                    <strong>4.8</strong>
                    <span>Rating</span>
                </div>
            </div>

            <div class="stat-card">
                <div class="icon">💬</div>
                <div class="stat-info">
                    <strong>18</strong>
                    <span>Messages</span>
                </div>
            </div>

            <div class="stat-card">
                <div class="icon">✅</div>
                <div class="stat-info">
                    <strong>92%</strong>
                    <span>Done</span>
                </div>
            </div>

        </main>

       
        <footer class="footer">
            <p>Made with CSS Grid</p>
        </footer>

    </div>

</body>
</html>
