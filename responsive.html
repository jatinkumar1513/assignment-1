<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title>TravelEase - Plan Your Trip</title>

    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 1rem;
            line-height: 1.6;
            color: #203747;
            background-color: #f1f6f7;
        }

        .navbar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background-color: #073653;
            color: white;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .nav-links a:hover {
            color: #ffd166;
        }

        
        .hero {
            display: grid;
            grid-template-columns: 1fr;
            justify-items: center;
            align-content: center;
            gap: 16px;
            padding: 28px 16px;
            text-align: center;
            color: white;
            background-color: #0879dc;
        }

        .hero h1 {
            font-size: 1.7rem;
            line-height: 1.3;
        }

        .hero p {
            font-size: 0.95rem;
            color: #e1f4ff;
        }

        
        .hero-image {
            width: 100%;
            max-width: 500px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            background-color: #c6e4ed;
        }

        .hero-image-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            min-height: 150px;
            background-color: #c6e4ed;
            color: #075078;
            border-radius: 10px;
        }

        .hero button {
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            background-color: #ffbd39;
            color: #243746;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .hero button:hover {
            background-color: #f2a900;
        }

       
        .features {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            padding: 25px 16px;
        }

        .feature-card {
            padding: 18px;
            text-align: center;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .feature-card h2 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .feature-card p {
            color: #526b78;
            font-size: 0.9rem;
        }

        footer {
            padding: 20px;
            text-align: center;
            background-color: #073653;
            color: white;
            font-size: 0.9rem;
        }

        
        @media (min-width: 768px) {
            .navbar {
                flex-direction: row;
                justify-content: space-between;
                padding: 14px 24px;
            }

            .hero {
                padding: 40px 24px;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero-image,
            .hero-image-placeholder {
                max-width: 500px;
                min-height: 180px;
            }

            .features {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 20px;
                padding: 30px 24px;
            }
        }

      
        @media (min-width: 1024px) {
            .navbar {
                padding: 16px 40px;
            }

            .logo {
                font-size: 1.5rem;
            }

            .nav-links {
                gap: 25px;
            }

            .hero {
                min-height: 350px;
                padding: 45px 40px;
            }

            .hero h1 {
                font-size: 2.3rem;
            }

            .hero-image,
            .hero-image-placeholder {
                max-width: 550px;
                min-height: 200px;
            }

            .features {
                max-width: 1100px;
                margin: auto;
                padding: 35px 20px;
            }
        }
    </style>
</head>

<body>

    
    <header class="navbar">
        <div class="logo">TravelEase</div>

        <nav class="nav-links">
            <a href="#home">Home</a>
            <a href="#trips">Trips</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>


    <main id="home">
        <section class="hero">
            <h1>Plan your next trip in minutes</h1>
            <p>Simple, cheap and fun travel plans.</p>

            
            <div class="hero-image-placeholder">
                <span><img src="./WhatsApp Image 2026-10-25 at 01.20.44.jpeg" alt="Hero Image" height="190" width="300"></span>
            </div>

            <button type="button"
                onclick="document.getElementById('trips').scrollIntoView({behavior:'smooth'})">
                Explore Trips
            </button>
        </section>

        
        <section class="features" id="trips">

            <article class="feature-card">
                <h2>Easy Booking</h2>
                <p>Plan and organise your trip with ease.</p>
            </article>

            <article class="feature-card">
                <h2>Best Prices</h2>
                <p>Discover affordable travel options.</p>
            </article>

            <article class="feature-card">
                <h2>24x7 Help</h2>
                <p>Get assistance whenever you need it.</p>
            </article>

        </section>
    </main>

    <footer id="contact">
        <p>Contact TravelEase | Your journey starts here.</p>
    </footer>

</body>
</html>
